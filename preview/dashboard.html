/* INNerCarry reference adaptation. Original Excel workbook is preserved. */
:root{font-family:'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif;--navy:#0B1739;--blue:#2F62F0;--line:#E2E8F0;color:var(--navy);background:#F8FAFC}
html{scroll-behavior:smooth;scroll-padding-top:18px}body{border-top:5px solid var(--blue)}
.shell{max-width:1480px;padding:38px 40px}header{align-items:flex-start;margin-bottom:26px}header h1{font-size:36px;line-height:1.35;letter-spacing:-1.6px}header .lead{font-size:15px;margin-top:14px}
.eyebrow{display:block;font-size:11px;font-weight:700;color:var(--blue);letter-spacing:1.1px;margin-bottom:10px}.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
button,.button,input,select{border-radius:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7B9BF7;outline-offset:2px}
.button.primary,button[aria-pressed=true]{background:var(--blue);color:white;border-color:var(--blue)}.section-nav{gap:28px;margin-bottom:22px}.section-nav a{font-size:14px;font-weight:600;text-decoration:none;color:var(--navy);padding:8px 0}
.notice{border-radius:4px;background:#EEF2FF;border-color:#d4dfff;color:#243d7b}.panel{border-radius:6px;padding:26px}.panel h2{font-size:20px}.kpis{gap:0;border:1px solid var(--line);background:white;border-top:3px solid var(--blue)}
.kpi{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;padding:20px;min-height:126px}.kpi:last-child{border-right:0}.kpi strong{font-variant-numeric:tabular-nums;font-size:33px}.kpi strong.missing{font-size:18px;padding-top:7px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.section-head label{font-size:13px;white-space:nowrap}.section-head input{width:66px;margin:0 5px}
.reminders{display:grid;grid-template-columns:repeat(4,1fr);margin:22px 0;border-block:1px solid var(--line)}.due-stat{padding:18px 12px;color:#475569;font-size:13px}.due-stat strong{display:block;margin-top:6px;font-size:23px;color:var(--navy)}.due-stat.danger strong{color:#991B1B}
.record-id{display:block;font-size:10px;color:#64748B}.deadline{font-size:12px;font-weight:600;white-space:nowrap}.deadline.overdue{color:#991B1B}.deadline.today{color:#9A5800}.deadline.upcoming{color:var(--blue)}.deadline.unknown{color:#64748B}
th{background:#EEF2FF;color:var(--navy)}td{font-size:13px}th button{border:0;background:none;padding:0;text-align:left;font-weight:600}td:first-child{max-width:380px}.footnote{font-size:12px;color:#64748B;margin-top:16px}
.excel-panel{border-left:4px solid var(--blue)}.excel-panel p{max-width:850px}.excel-panel .button{margin-top:12px}section[id]{scroll-margin-top:20px}
@media(max-width:1000px){.shell{padding:26px}.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(3){border-right:0}.kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}header h1{font-size:30px}.controls{max-width:260px}}
@media(max-width:600px){.shell{padding:22px 16px}.controls{max-width:none;justify-content:flex-start}.section-nav{gap:14px}.section-nav a{font-size:12px}.kpis{grid-template-columns:repeat(2,1fr)}.kpi{padding:16px}.kpi:nth-child(3){border-right:1px solid var(--line)}.kpi:nth-child(2n){border-right:0}.kpi:nth-child(4){border-bottom:1px solid var(--line)}.reminders{grid-template-columns:repeat(2,1fr)}.section-head{align-items:flex-start;flex-direction:column}.panel{padding:20px 16px}header h1{font-size:28px}}
@media print{body{border:0}.shell{padding:0}.section-nav,.controls{display:none}.reminders{grid-template-columns:repeat(4,1fr)}.panel{break-inside:avoid}}

 if(c.reviews==='missing')for(const k of ['reviewing','waiting','pending_registration','overdue','completed','median_completed_days','unknown_stage'])kpis[k]=null;
 const warnings=[];
 for(const m of data.methodologies){if(m.scope==='unclassified')warnings.push(`${m.id}: 산업부문 분류 확인 필요`);if(!m.first_registered_on)warnings.push(`${m.id}: 최초 등록연도 미확인`);if(!m.first_registered_on&&!m.registration_confirmed_on)warnings.push(`${m.id}: 등록 근거일 미확인; 등록 KPI 제외`);}
 for(const v of data.versions)if(!v.registered_on)warnings.push(`${v.id}: 버전 등록일 미확인; 연도별 신규/개정 제외`);
 for(const a of data.applications)if(!data.review_events.some(e=>e.application_id===a.id))warnings.push(`${a.id}: 검토 이력 미확보`);
 return {metadata:{...data.metadata,as_of:asof,knowledge_as_of:known,scope,selected_year:year,internal_threshold_days:threshold},kpis,annual,stage_counts:count(apps,a=>a.stage),technology_counts:count(reg,m=>m.technology),methodology_rows:ms,application_rows:apps,quality_warnings:warnings};
}
function csvValue(x){const s=String(x??'');return '"'+(/^[\s]*[=+@-]/.test(s)?"'"+s:s).replaceAll('"','""')+'"';}

/* Offline view: runs from a local file; no external libraries, network calls or storage. */
let dataset=structuredClone(DEMO),state={scope:'industry',as_of:DEMO.metadata.as_of,knowledge_as_of:DEMO.metadata.knowledge_as_of,year:2026,threshold:45,tab:'overview',search:'',page:0},lastError='';
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fmt=v=>v===null||v===undefined?'자료 미확보':Number(v).toLocaleString('ko-KR');
const coverageLabel={demo:'합성 예시',complete:'대상 범위 전체 확보',partial:'확인된 일부 자료',missing:'자료 미확보'};
function download(name,content,type='application/json'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function chart(annual){if(!annual.length)return '<div class="empty">등록자료 미확보</div>';const W=660,H=280,L=35,R=15,T=20,B=40,max=Math.max(1,...annual.map(x=>x.cumulative_known_year)),dx=(W-L-R)/annual.length,py=v=>H-B-(H-B-T)*v/max;
let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최초 등록연도 확인분의 연도별 신규·누적 건수">`;
for(let v=0;v<=max;v+=Math.max(1,Math.ceil(max/4))){const y=py(v);svg+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e6ecf3"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#6b7e94">${v}</text>`;}
let points=[];annual.forEach((r,i)=>{let x=L+dx*(i+.5);points.push(`${x},${py(r.cumulative_known_year)}`);svg+=`<rect x="${x-dx*.25}" y="${py(r.new)}" width="${dx*.5}" height="${H-B-py(r.new)}" rx="2" fill="#4a90d9"><title>${r.year}년 신규 ${r.new}건</title></rect><text x="${x}" y="${H-15}" text-anchor="middle" font-size="9" fill="#6b7e94">${r.year}</text>`;});
svg+=`<polyline fill="none" stroke="#1a2b5f" stroke-width="2.5" points="${points.join(' ')}"/>`;annual.forEach((r,i)=>{let x=L+dx*(i+.5);svg+=`<circle cx="${x}" cy="${py(r.cumulative_known_year)}" r="3" fill="#1a2b5f"><title>${r.year}년 확인분 누적 ${r.cumulative_known_year}건</title></circle>`;});return svg+'</svg><div class="legend"><span><i class="dot"></i>연도별 신규</span><span><i class="dot dark"></i>등록연도 확인분 누적</span></div>';}
function stageChart(s){if(dataset.metadata.coverage.reviews==='missing')return '<div class="empty">검토자료 미확보 · 0건으로 해석하지 않음</div>';let stages=['submitted','review','consultation','committee','approved','registered','rejected','withdrawn','unknown'];const max=Math.max(1,...Object.values(s.stage_counts));return '<div class="stages">'+stages.filter(k=>s.stage_counts[k]).map(k=>`<div class="stage-line"><span>${labels[k]}</span><div class="track"><div class="bar" style="width:${s.stage_counts[k]/max*100}%"></div></div><b>${s.stage_counts[k]}</b></div>`).join('')+'</div><p>단계별 현재 잔여 건수이며, 동일 접수집단의 승인 전환율이 아닙니다.</p>';}
function badges(status){return `<span class="badge ${status==='unknown'?'warn':''}">${esc(({active:'적용 가능',inactive:'적용 불가',unknown:'미확인'})[status]||labels[status]||status)}</span>`;}
function table(s,type){let rows=(type==='method'?s.methodology_rows.filter(r=>r.registered):s.application_rows).filter(r=>JSON.stringify(r).toLowerCase().includes(state.search.toLowerCase()));const max=Math.max(0,Math.ceil(rows.length/20)-1);state.page=Math.min(state.page,max);const shown=rows.slice(state.page*20,state.page*20+20);
let head=type==='method'?['코드','방법론명','범위','최초 등록일','적용 상태','상세']:['신청 ID','안건','현재 단계','경과일','보완 대기','다음 조치','상세'];
let html=`<div class="filters"><label class="grow">목록 검색<input id="search" value="${esc(state.search)}" placeholder="코드 · 방법론명 · 기술유형 검색 (입력 후 Enter)"/></label><button id="csv">현재 목록 CSV</button></div><div class="table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
for(const r of shown){const cells=type==='method'?[esc(r.code),esc(r.name),esc(scopes[r.scope]),esc(r.first_registered_on||'연도 미확인'),badges(r.applicability)]:[esc(r.id),esc(r.title),badges(r.stage),r.stage_age_days===null?'—':`${r.stage_age_days}일${r.is_overdue?' <span class="badge warn">관리기준 초과</span>':''}`,r.waiting?'대기':'—',esc(r.next_action||'—')];html+='<tr>'+cells.map((c,i)=>`<td class="${i===1?'name':''}">${c}</td>`).join('')+`<td><button class="detail" data-type="${type}" data-id="${esc(r.id)}">보기</button></td></tr>`;}
html+='</tbody></table></div>'+(rows.length?'':'<div class="empty">조건에 맞는 확인 자료가 없습니다.</div>')+`<div class="pagination"><span>${rows.length}건 · ${state.page+1}/${max+1} 페이지</span><div><button id="prev" ${state.page===0?'disabled':''}>이전</button> <button id="next" ${state.page>=max?'disabled':''}>다음</button></div></div>`;return html;}
function detail(type,id){let s=snapshot(dataset,state),r=(type==='method'?s.methodology_rows:s.application_rows).find(x=>x.id===id);if(!r)return;let hist=type==='method'?dataset.versions.filter(v=>v.methodology_id===id):dataset.review_events.filter(v=>v.application_id===id).sort((a,b)=>a.occurred_on.localeCompare(b.occurred_on)||a.sequence-b.sequence);const src=dataset.sources.find(x=>x.id===r.source_id);let url=src?.url&&/^https?:\/\//i.test(src.url)?`<a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">출처 원문</a>`:'출처 URL 없음 / 파일·내부대장 확인';
let html=`<div class="dialog-head"><div><small>${esc(id)}</small><h2>${esc(r.name||r.title)}</h2></div><button id="close">닫기</button></div><p>${url} · ${esc(src?.label||'')}</p><p>전체 저장 이력이며 기준일 이후 이력이 포함될 수 있습니다. 위 KPI는 선택한 기준일로 계산됩니다.</p><div class="table-wrap"><table><thead><tr>${(type==='method'?['버전','구분','등록일','유효시작일']:['발생일','기록일','현재단계','행위','메모']).map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>`;
for(const h of hist){const vals=type==='method'?[h.version,h.change_type==='new'?'신규':'개정',h.registered_on||'미확인',h.effective_from||'미확인']:[h.occurred_on,h.recorded_on,labels[h.stage],h.action,h.note];html+='<tr>'+vals.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>';}
const d=document.getElementById('details');d.innerHTML=html+'</tbody></table></div>';d.showModal();document.getElementById('close').onclick=()=>d.close();}
function render(){let s=snapshot(dataset,state),k=s.kpis;const navs={overview:'종합 현황',methods:'등록 방법론',reviews:'검토 현황',quality:'데이터 품질·출처'};
let html=`<header><div><small>K-ETS / METHODOLOGY DESK</small><h1>산업부문 외부사업 방법론</h1><div class="meta">등록 통계와 신청·검토 이력을 분리한 관리 대시보드</div></div><div class="controls"><label class="button">JSON 불러오기<input id="upload" hidden type="file" accept=".json"/></label> <button id="save">원본 JSON 저장</button></div></header><div class="notice"><b>${dataset.metadata.mode==='demo'?'합성 예시 · 공식 통계 아님':'로컬 불러오기 자료 · 외부 서버 전송 없음'}</b> — ${esc(dataset.metadata.coverage.scope_note)}</div><div class="meta">등록자료: ${coverageLabel[dataset.metadata.coverage.registrations]} / 검토자료: ${coverageLabel[dataset.metadata.coverage.reviews]} / 파일: ${esc(dataset.metadata.dataset_id)}</div><div class="error" role="alert">${esc(lastError)}</div><div class="filters controls"><label>집계 범위<select id="scope">${Object.entries(scopes).map(([v,l])=>`<option value="${v}" ${v===state.scope?'selected':''}>${l}</option>`).join('')}</select></label><label>발생 기준일<input id="asof" type="date" value="${state.as_of}"/></label><label>지식 기준일<input id="known" type="date" value="${state.knowledge_as_of}"/></label><label>집계 연도<input id="year" type="number" min="2015" max="2100" value="${state.year}"/></label><label>내부 경과일 기준<input id="threshold" type="number" min="0" max="9999" value="${state.threshold}"/></label><button id="reset">예시로 복원</button></div><nav>${Object.entries(navs).map(([v,l])=>`<button class="nav ${state.tab===v?'active':''}" data-tab="${v}">${l}</button>`).join('')}</nav>`;
if(state.tab==='overview'){html+='<section class="kpis">'+[['registered','누적 고유 방법론','개정 버전 중복 제외'],['active','적용 가능 확인','상태 근거 확인분'],['new_year',state.year+'년 신규','최초등록일 기준'],['revisions_year',state.year+'년 개정','버전 등록일 기준'],['reviewing','검토 중 신청','접수·검토·협의·심의'],['pending_registration','승인·등록대기','등록 완료와 구분']].map(([id,l,n])=>`<div class="kpi"><span>${l}</span><strong class="${k[id]===null?'missing':''}">${fmt(k[id])}</strong><small>${n}</small></div>`).join('')+'</section>';
html+=`<div class="summary"><span class="chip">최초등록연도 미확인 ${fmt(k.unknown_year)}</span><span class="chip">보완 대기 ${fmt(k.waiting)}</span><span class="chip">내부 관리기준 초과 ${fmt(k.overdue)}</span><span class="chip">완료 건 처리기간 중앙값 ${k.median_completed_days===null?'산정자료 없음':k.median_completed_days+'일'}</span></div><div class="charts"><section class="panel"><h2>연도별 신규·누적 등록</h2><p>최초 등록연도 확인분만 표시 · 등록연도 미확인분은 전체 KPI에만 포함</p>${chart(s.annual)}</section><section class="panel"><h2>신청 단계별 현황</h2>${stageChart(s)}</section></div><section class="panel"><h2>해석 시 확인사항</h2><div class="notes"><article><b>방법론 ≠ 버전 ≠ 신청</b><p>하나의 방법론에 여러 개정 버전과 신청 사건이 연결될 수 있습니다.</p></article><article><b>관리기준 초과 ≠ 법정 지연</b><p>${state.threshold}일은 예시 내부 관리기준입니다. 공식 처리기한으로 해석하지 않습니다.</p></article></div></section>`;}
if(state.tab==='methods'||state.tab==='reviews')html+=`<section class="panel"><h2>${state.tab==='methods'?'등록 방법론 원장':'신청·검토 원장'}</h2>${table(s,state.tab==='methods'?'method':'app')}</section>`;
if(state.tab==='quality'){html+=`<section class="panel"><h2>검증 경고 ${s.quality_warnings.length}건</h2><p>원본 전체 범위의 경고이며 현재 부문 필터와 무관합니다.</p>${s.quality_warnings.map(x=>`<p class="chip">${esc(x)}</p>`).join('')||'<p>형식·관계 검증 통과</p>'}</section><section class="panel"><h2>출처 원장</h2><table><thead><tr><th>ID</th><th>명칭</th><th>구분</th><th>접근범위</th><th>확인일</th></tr></thead><tbody>${dataset.sources.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.label)}</td><td>${esc(x.kind)}</td><td>${esc(x.access)}</td><td>${x.retrieved_on}</td></tr>`).join('')}</tbody></table><p>공식 참고: <a href="https://ors.gir.go.kr/home/orme010/activeList.do?menuId=10" target="_blank" rel="noopener">ORS 방법론 목록</a> / <a href="https://offset.energy.or.kr/methodology/agree.do" target="_blank" rel="noopener">한국에너지공단 방법론 승인 안내</a></p></section>`;}
html+='<footer>일 단위 / Asia·Seoul · 로컬 조회용 MVP · 원본 파일은 서버에 전송하거나 브라우저 저장소에 보관하지 않음. 공동편집·승인권한·외부자료 자동수집은 연결 전입니다.<br>분야 구분은 현재 원장의 분류이며, 과거 분류 변경까지 재현하려면 당시 데이터 스냅샷이 필요합니다.</footer><dialog id="details"></dialog>';
document.getElementById('root').innerHTML=html;
for(const [id,key] of [['scope','scope'],['asof','as_of'],['known','knowledge_as_of'],['year','year'],['threshold','threshold']])document.getElementById(id).onchange=e=>{if(!e.target.value)return;state[key]=['year','threshold'].includes(key)?Number(e.target.value):e.target.value;state.page=0;render();};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.page=0;state.search='';render();});
document.getElementById('reset').onclick=()=>{dataset=structuredClone(DEMO);state.as_of=DEMO.metadata.as_of;state.knowledge_as_of=DEMO.metadata.knowledge_as_of;lastError='';render();};
document.getElementById('save').onclick=()=>download(dataset.metadata.dataset_id+'.json',JSON.stringify(dataset,null,2));
document.getElementById('upload').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>10_000_000)throw Error('JSON은 10MB 이내로 제한합니다.');let next=JSON.parse(await f.text());validate(next);dataset=next;state.as_of=next.metadata.as_of;state.knowledge_as_of=next.metadata.knowledge_as_of;state.year=Number(next.metadata.as_of.slice(0,4));lastError='';state.page=0;render();}catch(e){lastError=e.message;render();}};
if(document.getElementById('search')){document.getElementById('search').onchange=e=>{state.search=e.target.value;state.page=0;render();};document.getElementById('prev').onclick=()=>{state.page--;render();};document.getElementById('next').onclick=()=>{state.page++;render();};document.querySelectorAll('.detail').forEach(b=>b.onclick=()=>detail(b.dataset.type,b.dataset.id));document.getElementById('csv').onclick=()=>{let rows=(state.tab==='methods'?s.methodology_rows.filter(r=>r.registered):s.application_rows).filter(r=>JSON.stringify(r).toLowerCase().includes(state.search.toLowerCase()));if(!rows.length)return;const fields=Object.keys(rows[0]);let csv='\ufeff'+[fields.map(csvValue).join(','),...rows.map(r=>fields.map(f=>csvValue(r[f])).join(','))].join('\r\n');download('filtered-'+state.tab+'.csv',csv,'text/csv;charset=utf-8');};}
}
render();
</script></body></html>
