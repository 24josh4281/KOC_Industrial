name: Validate dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-ingest.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/web.test.mjs tests/materials.test.mjs tests/management.test.mjs
      - run: python scripts/build_offline.py
      - run: git diff --exit-code -- preview/dashboard.html
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python scripts/stage_public_site.py
      - run: git diff --exit-code -- index.html assets downloads .nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: excel-and-web
          path: |
            excel/KETS_Methodology_Dashboard.xlsx
            excel/KETS_Public_Insights_20261014.xlsx
            web/dist
            preview/dashboard.html
